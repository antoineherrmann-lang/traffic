<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feu Vert</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#dfe4d8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1518" media="(prefers-color-scheme: dark)">
<style>
:root{
  --ground:#dfe4d8; --glass:rgba(250,250,248,.74); --glass-line:rgba(255,255,255,.7);
  --ink:#1c2024; --muted:#6c7378; --hair:rgba(20,30,40,.09); --row:rgba(255,255,255,.55);
  --row-on:rgba(255,255,255,.95); --go:#1f9d61; --go-ink:#ffffff; --amber:#d99a16; --stop:#d9483b;
  --shadow:0 18px 50px rgba(30,40,50,.18), 0 2px 6px rgba(30,40,50,.08);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --ground:#0f1518; --glass:rgba(24,30,35,.7); --glass-line:rgba(255,255,255,.09);
    --ink:#e9edf0; --muted:#8b969d; --hair:rgba(255,255,255,.08); --row:rgba(255,255,255,.045);
    --row-on:rgba(255,255,255,.1); --go:#35c27e; --go-ink:#05140c; --amber:#f0b93a; --stop:#f06a5c;
    --shadow:0 18px 50px rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ground);color:var(--ink);overflow:hidden;
  font:13px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font:inherit;color:inherit}
.glass{background:var(--glass);border:1px solid var(--glass-line);box-shadow:var(--shadow);
  -webkit-backdrop-filter:blur(26px) saturate(1.6);backdrop-filter:blur(26px) saturate(1.6)}

#panel{position:fixed;top:14px;right:14px;bottom:14px;width:272px;display:flex;flex-direction:column;border-radius:22px;overflow:hidden}
#scroll{flex:1;overflow-y:auto;padding:16px 14px 10px}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--muted)}
.brand i{width:9px;height:9px;border-radius:50%;background:var(--go);box-shadow:0 0 0 3px color-mix(in srgb,var(--go) 22%,transparent)}
.brand span{margin-left:auto;font-weight:500;font-size:12px}
.money{font-size:40px;font-weight:700;letter-spacing:-.03em;line-height:1.05;margin-top:10px;font-variant-numeric:tabular-nums}
.money small{font-size:20px;font-weight:600;color:var(--muted);margin-left:4px}
.rate{color:var(--muted);font-variant-numeric:tabular-nums;margin-top:2px}
.flu{margin-top:14px}
.line{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.line b{font-variant-numeric:tabular-nums}
.bar{height:5px;border-radius:3px;background:var(--hair);margin-top:6px;overflow:hidden}
.bar span{display:block;height:100%;width:100%;border-radius:3px;background:var(--go);transition:width .4s,background .4s}
.card{background:var(--row);border:1px solid var(--hair);border-radius:13px;padding:9px 11px;margin-top:12px}
.card .t{font-weight:600}
.card .r{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
h2{font-size:12px;font-weight:600;color:var(--muted);margin:18px 2px 8px}
.up{display:grid;grid-template-columns:1fr auto;gap:1px 10px;width:100%;text-align:left;
  background:var(--row);border:1px solid var(--hair);border-radius:13px;padding:8px 11px;margin-bottom:6px;cursor:pointer;
  transition:background .15s,transform .1s}
.up .n{font-weight:600}
.up .d{grid-column:1;color:var(--muted);font-size:12px}
.up .c{grid-row:1/3;grid-column:2;align-self:center;font-weight:600;font-variant-numeric:tabular-nums;
  padding:4px 9px;border-radius:999px;background:var(--hair);color:var(--muted);white-space:nowrap}
.up.ok{background:var(--row-on)}
.up.ok .c{background:var(--go);color:var(--go-ink)}
.up.ok:hover{transform:translateY(-1px)}
.up.ok:active{transform:scale(.985)}
.up:not(.ok){cursor:default}
.up.max .c{background:transparent}
.up.sure .c{background:var(--amber);color:#2a1c00}
button:focus-visible,summary:focus-visible{outline:2px solid var(--go);outline-offset:2px}
.note{color:var(--muted);font-size:12px;margin:0 2px}
.note b{color:var(--ink);font-weight:600}
details{margin-top:14px;border-top:1px solid var(--hair);padding-top:10px}
summary{cursor:pointer;font-weight:600;font-size:12px;color:var(--muted);list-style:none;display:flex;justify-content:space-between;padding:0 2px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-weight:500}
details[open] summary::after{content:"−"}
.ach{display:grid;grid-template-columns:auto 1fr;gap:1px 8px;margin:8px 2px 0;font-size:12px;color:var(--muted)}
.ach i{grid-row:1/3;width:8px;height:8px;border-radius:50%;margin-top:4px;background:var(--hair)}
.ach b{color:var(--muted);font-weight:600}
.ach.on i{background:var(--go)}
.ach.on b{color:var(--ink)}
#spark{display:block;width:100%;height:46px;margin-top:10px}
.stat{display:flex;justify-content:space-between;margin:5px 2px 0;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.stat b{color:var(--ink);font-weight:600}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.btns button{background:var(--row);border:1px solid var(--hair);border-radius:10px;padding:7px 8px;cursor:pointer;font-weight:600;font-size:12px;text-align:center}
.btns button:hover{background:var(--row-on)}
.btns button.wide{grid-column:1/3}
.btns button.go{background:var(--go);color:var(--go-ink);border-color:transparent}
#sv-text{display:block;width:100%;margin-top:8px;border:1px solid var(--hair);border-radius:10px;background:var(--row-on);color:var(--ink);
  font:11px/1.4 ui-monospace,Menlo,monospace;padding:8px;resize:vertical;user-select:text;-webkit-user-select:text;word-break:break-all}
#sv-text[hidden],#sv-confirm[hidden]{display:none}
#sv-confirm .btns{margin-top:8px}
#foot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 16px 11px;border-top:1px solid var(--hair);color:var(--muted);font-size:12px}
#foot button{background:none;border:0;padding:2px 0;cursor:pointer;color:var(--muted);text-decoration:underline;text-underline-offset:2px}
#foot button.sure{color:var(--stop);font-weight:600}
#foot button.on{color:var(--go);text-decoration:none;font-weight:600}

#hud{position:fixed;top:14px;left:14px;display:flex;align-items:center;gap:10px;border-radius:999px;padding:6px 6px 6px 14px;white-space:nowrap}
#clock{font-weight:700;font-variant-numeric:tabular-nums}
#phase{color:var(--muted)}
#hud button{border:0;border-radius:999px;padding:5px 11px;background:var(--hair);cursor:pointer;font-weight:600;font-variant-numeric:tabular-nums}
#hud button.on{background:var(--go);color:var(--go-ink)}

#banner{position:fixed;top:60px;left:14px;transform:translateY(-8px);opacity:0;pointer-events:none;
  border-radius:999px;padding:8px 15px 8px 12px;font-weight:600;display:flex;align-items:center;gap:9px;white-space:nowrap;
  transition:opacity .25s,transform .25s}
#banner.on{opacity:1;transform:none}
#banner i{width:9px;height:9px;border-radius:50%;background:var(--amber)}
#banner.alert i{background:var(--stop);animation:blink .7s infinite}
#banner span{color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
@keyframes blink{50%{opacity:.25}}
#toasts{position:fixed;left:14px;bottom:14px;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:min(420px,calc(100% - 320px))}
.toast{border-radius:14px;padding:9px 13px;font-weight:500;animation:rise .3s both}
.toast b{font-weight:700}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
#paused{position:fixed;left:calc((100% - 286px)/2);top:50%;transform:translate(-50%,-50%);border-radius:18px;padding:14px 22px;
  font-weight:700;font-size:16px;display:none;pointer-events:none}
body.paused #paused{display:block}
@media (prefers-reduced-motion: reduce){#banner.alert i{animation:none}.toast{animation:none}}
@media (max-width:720px){
  #panel{top:auto;left:10px;right:10px;bottom:10px;width:auto;height:44%}
  #toasts{bottom:auto;top:104px;max-width:calc(100% - 28px)}
  #paused{left:50%;top:28%}
  #phase{display:none}
}
</style>
</head>
<body>
<canvas id="cv" aria-label="Carte de la ville : clique sur un carrefour pour changer son feu"></canvas>

<div id="hud" class="glass">
  <span id="clock">09:00</span><span id="phase">Matinée</span>
  <button id="b-pause" type="button" title="Espace">Pause</button>
  <button id="b-speed" type="button" title="Touche V">×1</button>
</div>
<div id="banner" class="glass" role="status"><i></i><b id="bn-t"></b><span id="bn-s"></span></div>
<div id="toasts"></div>
<div id="paused" class="glass">En pause</div>

<aside id="panel" class="glass">
  <div id="scroll">
    <div class="brand"><i></i>Feu Vert<span id="cityname"></span></div>
    <div class="money"><span id="money">0</span><small>€</small></div>
    <div class="rate" id="rate">0 € par minute</div>
    <div class="flu">
      <div class="line"><span>Fluidité du trafic</span><b id="fmul">×2,0</b></div>
      <div class="bar"><span id="fbar"></span></div>
    </div>
    <div class="card" id="mission">
      <div class="line"><span class="t" id="mi-t"></span><span class="r" id="mi-r"></span></div>
      <div class="bar"><span id="mi-bar"></span></div>
    </div>
    <h2>Améliorations</h2>
    <div id="ups"></div>
    <h2>Équipements de la ville</h2>
    <div id="eqs"></div>
    <h2>Carrefours</h2>
    <p class="note" id="intsum"></p>
    <h2>Nouvelle ville</h2>
    <div id="city"></div>
    <details id="d-ach"><summary><span id="ach-sum">Succès</span></summary><div id="achs"></div></details>
    <details id="d-stat"><summary><span>Statistiques</span></summary>
      <canvas id="spark" width="480" height="92" aria-label="Revenu par minute sur les dix dernières minutes"></canvas>
      <div id="stats"></div>
    </details>
    <details id="d-save"><summary><span id="save-sum">Sauvegarde</span></summary>
      <p class="note" id="save-info" style="margin-top:8px"></p>
      <div class="btns">
        <button id="sv-now" type="button" class="wide" title="Cmd + S">Sauvegarder maintenant</button>
        <button id="sv-exp" type="button">Exporter un fichier</button>
        <button id="sv-imp" type="button">Importer un fichier</button>
        <button id="sv-copy" type="button">Copier le code</button>
        <button id="sv-load" type="button">Charger un code</button>
        <button id="sv-back" type="button" class="wide" hidden></button>
      </div>
      <textarea id="sv-text" rows="4" hidden spellcheck="false" aria-label="Code de sauvegarde" placeholder="Colle ici un code de sauvegarde"></textarea>
      <div id="sv-confirm" class="card" hidden>
        <div id="sv-what"></div>
        <div class="btns"><button id="sv-yes" type="button" class="go">Remplacer ma partie</button><button id="sv-no" type="button">Annuler</button></div>
      </div>
      <input type="file" id="sv-file" accept=".json,.txt,application/json,text/plain" hidden>
    </details>
    <p class="note" style="margin-top:14px">Touches 1 à 9 pour les carrefours, Espace pour la pause, V pour la vitesse.</p>
  </div>
  <div id="foot"><button id="notif" type="button">Activer les notifications</button><button id="reset" type="button">Recommencer</button></div>
</aside>

<script>
(() => {
'use strict';

/* ───────── Constantes ───────── */
const W = 1200, H = 780, GAP = 6, EXT = 280, CW = 11;
const XS = [200, 600, 1000], YS = [130, 390, 650], RIV = [770, 830];
const ROAD_ORDER = [['V', 0], ['H', 0], ['V', 2], ['H', 2]];
const ROAD_COST = [250, 1500, 8000, 40000];
const KEY = 'feu-vert-save-v2', OLD_KEY = 'feu-vert-save-v1';
const PANEL_W = 286, DAY = 720;
const MAPS = ['grid', 'round', 'avenue', 'pont'];
const MAP_NAME = { grid: 'Quadrillage', round: 'Le Giratoire', avenue: 'La Grande Avenue', pont: 'Les Deux Rives' };
const KIND = {
  car:    { len: 20, sp: 1,    acc: 170, val: 1, turn: true },
  bus:    { len: 34, sp: .82,  acc: 110, val: 5 },
  truck:  { len: 46, sp: .75,  acc: 85,  val: 3 },
  bike:   { len: 9,  sp: .72,  acc: 120, val: .5 },
  tram:   { len: 76, sp: .9,   acc: 90,  val: 12 },
  convoy: { len: 84, sp: .5,   acc: 50,  val: 0 },
  amb:    { len: 24, sp: 1.25, acc: 220, val: 0 },
  gold:   { len: 24, sp: 1,    acc: 170, val: 0 }
};
const UP = {
  value:   { name: 'Valeur des trajets', base: 30, g: 1.6, max: 30 },
  traffic: { name: 'Densité du trafic',  base: 50, g: 1.9, max: 8 },
  speed:   { name: 'Limite de vitesse',  base: 80, g: 1.8, max: 8 }
};
const EQ = {
  wave: { name: 'Onde verte', d: 'Les feux à capteurs voisins se synchronisent', cost: 3000 },
  prio: { name: 'Priorité aux secours', d: 'Les feux automatisés s’ouvrent devant l’ambulance', cost: 1500 },
  tow:  { name: 'Dépanneuse', d: 'Répare les pannes et dégage les accidents seule', cost: 2500 }
};
const ACH = [
  ['first', 'Premier feu vert', 'Change un feu à la main'],
  ['c100', 'Ça roule', '100 véhicules passés'],
  ['c1k', 'Heure d’affluence', '1 000 véhicules passés'],
  ['c10k', 'Périphérique', '10 000 véhicules passés'],
  ['auto', 'Mains libres', 'Installe un feu automatique'],
  ['round', 'Tourner en rond', 'Aménage un mini-giratoire'],
  ['grid', 'Réseau complet', 'Ouvre les 9 carrefours'],
  ['full', 'Ville intelligente', 'Équipe les 9 carrefours en capteurs ou giratoire'],
  ['amb3', 'Voie royale', '3 ambulances d’affilée sans arrêt'],
  ['gold5', 'Convoyeur', 'Intercepte 5 fourgons blindés'],
  ['streak', 'Tapis vert', '500 véhicules d’affilée sans attente'],
  ['safe', 'Journée sans accident', 'Une journée complète sans accrochage'],
  ['convoy', 'Escorte', 'Fais traverser un convoi exceptionnel sans arrêt'],
  ['million', 'Millionnaire', 'Gagne 1 M€ au total'],
  ['city', 'Bâtisseur', 'Fonde une nouvelle ville']
];

/* ───────── Sauvegarde ───────── */
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
  clear(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
function fresh() {
  return { money: 0, total: 0, cars: 0, roads: 0, lv: { value: 0, traffic: 0, speed: 0 }, inter: {},
           eq: { wave: 0, prio: 0, tow: 0 }, F: 1, rate: 0, seen: Date.now(), tuto: true, clock: 9, day: 1,
           city: 0, ach: {}, streak: 0, mission: null, hist: [], notif: false,
           st: { cars: 0, total: 0, play: 0, bestRate: 0, bestStreak: 0, acc: 0, accToday: 0, amb: 0, ambRow: 0, gold: 0, convoy: 0, repairs: 0 } };
}
function load() {
  let s = store.get(KEY);
  if (!s) {
    const o = store.get(OLD_KEY); // reprise de la première version
    if (o) s = { money: o.money, total: o.total, cars: o.cars, roads: o.roads, lv: o.lv, inter: o.inter, F: o.F, rate: o.rate, seen: o.seen, tuto: o.tuto,
                 st: Object.assign(fresh().st, { cars: o.cars || 0, total: o.total || 0 }) };
  }
  return normalize(s);
}
// Remet n'importe quelle sauvegarde (ancienne, importée, abîmée) dans un état jouable.
function normalize(s) {
  const f = fresh(), obj = v => v && typeof v === 'object' && !Array.isArray(v) ? v : {};
  const num = (v, d, lo = 0, hi = Infinity) => { v = +v; return isFinite(v) ? Math.min(hi, Math.max(lo, v)) : d; };
  const r = Object.assign({}, f, JSON.parse(JSON.stringify(obj(s))));
  r.lv = Object.assign(f.lv, obj(r.lv)); r.eq = Object.assign(f.eq, obj(r.eq)); r.st = Object.assign(f.st, obj(r.st));
  r.inter = obj(r.inter); r.ach = obj(r.ach);
  for (const k of ['money', 'total', 'cars', 'rate', 'streak']) r[k] = num(r[k], 0);
  r.F = num(r.F, 1, 0, 1); r.clock = num(r.clock, 9, 0, 23.999); r.day = Math.floor(num(r.day, 1, 1));
  r.roads = Math.floor(num(r.roads, 0, 0, ROAD_ORDER.length)); r.city = Math.floor(num(r.city, 0));
  for (const k in UP) r.lv[k] = Math.floor(num(r.lv[k], 0, 0, UP[k].max));
  for (const k in EQ) r.eq[k] = r.eq[k] ? 1 : 0;
  for (const k in r.inter) { if (/^[0-2]-[0-2]$/.test(k)) r.inter[k] = Math.floor(num(r.inter[k], 0, 0, 3)); else delete r.inter[k]; }
  for (const k in f.st) r.st[k] = num(r.st[k], 0);
  r.hist = (Array.isArray(r.hist) ? r.hist : []).map(Number).filter(isFinite).slice(-60);
  r.seen = num(r.seen, Date.now(), 0, Date.now());
  r.tuto = !!r.tuto; r.notif = !!r.notif;
  const m = r.mission;
  r.mission = m && typeof m === 'object' && typeof m.id === 'string' ? { id: m.id, goal: num(m.goal, 1, 1), prog: num(m.prog, 0) } : null;
  return r;
}
let S = load();

/* ───────── Formules ───────── */
const mapType = () => MAPS[S.city % MAPS.length];
const hH = i => (mapType() === 'avenue' && i === 1) ? 44 : 22;
const carValue = (l = S.lv.value) => Math.pow(1.25, l);
const spawnRate = (l = S.lv.traffic) => 0.25 * (1 + 0.06 * l);
const vMax = (l = S.lv.speed) => 90 * (1 + 0.06 * l);
const fluMult = () => 0.5 + 1.5 * S.F;
const cityMult = () => 1 + 0.5 * S.city;
const achCount = () => ACH.filter(a => S.ach[a[0]]).length;
const achMult = () => 1 + 0.02 * achCount();
const upCost = k => Math.round(UP[k].base * Math.pow(UP[k].g, S.lv[k]));
const tramOn = () => S.roads >= 2;
function lightCost(n) {
  if (n.level === 0) return Math.round(75 * Math.pow(1.45, inters.filter(m => m.level === 1 || m.level === 2).length));
  if (n.level === 1) return Math.round(500 * Math.pow(1.5, inters.filter(m => m.level === 2).length));
  return Infinity;
}
const roundCost = () => Math.round(450 * Math.pow(1.5, inters.filter(m => m.level === 3 && !m.fixed).length));
const bonus = (sec, min) => Math.max(min * carValue() * cityMult(), S.rate * sec);
function trafficF(h) {
  if (h < 5.5 || h >= 22) return .5;
  if (h < 7.5) return .5 + (h - 5.5) / 2 * .5;
  if (h < 9) return 1.35;
  if (h < 17.5) return 1;
  if (h < 19) return 1.35;
  return 1 - (h - 19) / 3 * .5;
}
const isPeak = h => (h >= 7.5 && h < 9) || (h >= 17.5 && h < 19);
function darkness(h) {
  if (h < 5.5 || h >= 21.5) return 1;
  if (h < 7.5) return 1 - (h - 5.5) / 2;
  if (h < 19.5) return 0;
  return (h - 19.5) / 2;
}
function phaseName(h) {
  return h < 5.5 ? 'Nuit' : h < 7.5 ? 'Petit matin' : h < 9 ? 'Pointe du matin' : h < 12 ? 'Matinée' : h < 14 ? 'Midi'
       : h < 17.5 ? 'Après-midi' : h < 19 ? 'Pointe du soir' : h < 22 ? 'Soirée' : 'Nuit';
}

const nf1 = new Intl.NumberFormat('fr-FR', { maximumFractionDigits: 1 });
const nf0 = new Intl.NumberFormat('fr-FR', { maximumFractionDigits: 0 });
function fmt(n) {
  if (!isFinite(n)) return '—';
  if (n < 100) return nf1.format(Math.round(n * 10) / 10);
  if (n < 1e4) return nf0.format(Math.round(n));
  for (const [v, s] of [[1e12, ' Bn'], [1e9, ' Md'], [1e6, ' M'], [1e3, ' k']])
    if (n >= v) return (n / v < 100 ? nf1 : nf0).format(n / v) + s;
}
const fmtMoney = n => n < 1e4 ? nf0.format(Math.floor(n)) : fmt(n);
const rand = a => a[(Math.random() * a.length) | 0];

/* ───────── Réseau ───────── */
let lanes = [], inters = [];
const laneMap = new Map();
const activeH = i => i === 1 || ROAD_ORDER.slice(0, S.roads).some(r => r[0] === 'H' && r[1] === i);
const activeV = j => j === 1 || ROAD_ORDER.slice(0, S.roads).some(r => r[0] === 'V' && r[1] === j);
const laneId = (axis, idx, dir, k) => axis + idx + (dir > 0 ? '+' : '-') + k;
const laneOf = (axis, idx, dir, k) => laneMap.get(laneId(axis, idx, dir, k));

function build() {
  const old = new Map(inters.map(n => [n.id, n])), t = mapType();
  inters = [];
  for (let i = 0; i < 3; i++) if (activeH(i))
    for (let j = 0; j < 3; j++) if (activeV(j)) {
      const id = i + '-' + j;

  if (ev.convoy) return { alert: true, t: 'Convoi exceptionnel', s: 'prime s’il traverse sans attendre' };
  if (ev.bridge) return { alert: false, t: 'Pont levé', s: 'un bateau passe, encore ' + Math.ceil(ev.bridge.t) + ' s' };
  if (ev.works) return { alert: false, t: 'Travaux', s: 'clique sur le chantier pour l’accélérer, ' + Math.ceil(ev.works.t) + ' s' };
  if (ev.stade) return { alert: false, t: 'Sortie de stade', s: 'afflux sur une route pendant ' + Math.ceil(ev.stade.t) + ' s' };
  if (ev.rain > 0) return { alert: false, t: 'Averse', s: 'freinages plus longs, revenus ×1,25 pendant ' + Math.ceil(ev.rain) + ' s' };
  if (isPeak(S.clock)) return { alert: false, t: 'Heure de pointe', s: 'trafic dense, revenus ×1,5' };
  return null;
}

const MISSIONS = {
  cars:   { text: g => 'Fais passer ' + g + ' véhicules', goal: () => Math.round(50 + lanes.length * 10) },
  earn:   { text: g => 'Gagne ' + fmt(g) + ' €', goal: () => Math.max(60, Math.round(S.rate * 75)) },
  flu:    { text: g => 'Tiens ' + g + ' s au-dessus de 85 % de fluidité', goal: () => 60 },
  amb:    { text: () => 'Laisse passer une ambulance sans arrêt', goal: () => 1 },
  gold:   { text: () => 'Intercepte un fourgon blindé', goal: () => 1 },
  streak: { text: g => 'Enchaîne ' + g + ' véhicules sans attente', goal: () => 30 + lanes.length * 4 }
};
function newMission() {
  const ids = Object.keys(MISSIONS).filter(k => !S.mission || k !== S.mission.id);
  const id = rand(ids);
  S.mission = { id, goal: MISSIONS[id].goal(), prog: 0 };
  if (id === 'amb' || id === 'gold') { ev.force = id; ev.next = Math.min(ev.next, 12); }
}
function missionHit(id, x) {
  const m = S.mission;
  if (!m || m.id !== id || m.done) return;
  m.prog += x;
  if (m.prog >= m.goal) {
    m.done = true; // évite la récursion via earn()
    const b = bonus(45, 45);
    S.money += b; S.total += b; S.st.total += b; windowInc += b;
    toast('Objectif atteint : <b>+' + fmt(b) + ' €</b>');
    newMission();

}
function unlock(id) {
  if (S.ach[id]) return;
  S.ach[id] = 1;
  const a = ACH.find(a => a[0] === id);
  toast('Succès débloqué : <b>' + a[1] + '</b>, revenus +2 %', 6000);
  renderAch();
}
let dayFull = false;
function checkAch() {
  const c = S.st.cars;
  if (c >= 100) unlock('c100'); if (c >= 1000) unlock('c1k'); if (c >= 10000) unlock('c10k');
  if (inters.some(n => n.level === 1 || n.level === 2)) unlock('auto');
  if (inters.some(n => n.level === 3 && !n.fixed)) unlock('round');
  if (inters.length === 9) unlock('grid');
  if (cityReady()) unlock('full');
  if (S.st.ambRow >= 3) unlock('amb3');
  if (S.st.gold >= 5) unlock('gold5');
  if (S.streak >= 500) unlock('streak');
  if (S.st.convoy >= 1) unlock('convoy');
  if (S.st.total >= 1e6) unlock('million');
  if (S.city >= 1) unlock('city');
}
const cityReady = () => inters.length === 9 && inters.every(n => n.level >= 2);

function resize() {

  cw = window.innerWidth; ch = window.innerHeight;
  for (const c of [cv, bgDay, bgNight]) { c.width = Math.round(cw * dpr); c.height = Math.round(ch * dpr); }
  const narrow = mqNarrow.matches;
  const vw = narrow ? cw : Math.max(200, cw - PANEL_W), vh = narrow ? ch * 0.56 : ch;

  ox = (vw - W * sc) / 2; oy = (vh - H * sc) / 2;

}
function mulberry(a) {
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function rr(g, x, y, w, h, r) {

  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();

function drawStatic(canvas, p, night) {
  const g = canvas.getContext('2d'), t = mapType(), far = 1600;
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.fillStyle = p.ground; g.fillRect(0, 0, canvas.width, canvas.height);
  g.setTransform(dpr * sc, 0, 0, dpr * sc, dpr * ox, dpr * oy);

  // Îlots : bâtiments et parcs
  const bx = [-far], by = [-far];
  for (let j = 0; j < 3; j++) bx.push(XS[j] - 22, XS[j] + 22);
  for (let i = 0; i < 3; i++) by.push(YS[i] - hH(i), YS[i] + hH(i));
  bx.push(W + far); by.push(H + far);
  const rnd = mulberry(20261116 + S.city * 7919), rw = mulberry(4242 + S.city);
  for (let a = 0; a < 4; a++) for (let b = 0; b < 4; b++) {
    const x0 = bx[b * 2] + 5, x1 = bx[b * 2 + 1] - 5, y0 = by[a * 2] + 5, y1 = by[a * 2 + 1] - 5;
    g.fillStyle = p.block; rr(g, x0, y0, x1 - x0, y1 - y0, 9); g.fill();
    const pad = 8;
    let y = y0 + pad;
    while (y < y1 - pad - 16) {
      let h = 36 + rnd() * 42;
      if (y1 - pad - (y + h) < 30) h = y1 - pad - y;
      let x = x0 + pad;
      while (x < x1 - pad - 16) {
        let w = 34 + rnd() * 58;
        if (x1 - pad - (x + w) < 30) w = x1 - pad - x;
        const r = rnd(), tone = (rnd() * p.bld.length) | 0;
        if (r < 0.17) {
          g.fillStyle = p.park; rr(g, x, y, w, h, 7); g.fill();
          g.fillStyle = p.tree;
          const nt = 1 + ((w * h) / 900 | 0);
          for (let q = 0; q < nt; q++) { g.beginPath(); g.arc(x + 8 + rnd() * (w - 16), y + 8 + rnd() * (h - 16), 4 + rnd() * 3.5, 0, 7); g.fill(); }
        } else {
          g.fillStyle = p.bld[tone]; rr(g, x, y, w, h, 4); g.fill();
          g.fillStyle = p.roof; rr(g, x + 4, y + 4, w - 8, h - 8, 2.5); g.fill();
          if (night) {
            g.fillStyle = 'rgba(255,214,130,.5)';
            const nw = (rw() * 4) | 0;
            for (let q = 0; q < nw; q++) g.fillRect(x + 6 + rw() * Math.max(1, w - 16), y + 6 + rw() * Math.max(1, h - 16), 3.5, 3.5);
          }
        }
        x += w + 6;
      }
      y += h + 6;
    }
  }

  // Fleuve
  if (t === 'pont') {
    g.fillStyle = p.ground; g.fillRect(RIV[0] - 7, -far, RIV[1] - RIV[0] + 14, H + 2 * far);
    g.fillStyle = p.water; g.fillRect(RIV[0], -far, RIV[1] - RIV[0], H + 2 * far);
  }

  // Routes en projet
  g.strokeStyle = p.proj; g.lineWidth = 1.5; g.setLineDash([7, 7]);
  for (let i = 0; i < 3; i++) if (!activeH(i)) for (const d of [-hH(i) + 4, hH(i) - 4]) {
    g.beginPath(); g.moveTo(-far, YS[i] + d); g.lineTo(W + far, YS[i] + d); g.stroke();
  }
  for (let j = 0; j < 3; j++) if (!activeV(j)) for (const d of [-18, 18]) {
    g.beginPath(); g.moveTo(XS[j] + d, -far); g.lineTo(XS[j] + d, H + far); g.stroke();
  }
  g.setLineDash([]);

  // Chaussées
  g.fillStyle = p.road;
  for (let i = 0; i < 3; i++) if (activeH(i)) g.fillRect(-far, YS[i] - hH(i), W + 2 * far, hH(i) * 2);
  for (let j = 0; j < 3; j++) if (activeV(j)) g.fillRect(XS[j] - 22, -far, 44, H + 2 * far);
  if (t === 'pont') for (let i = 0; i < 3; i++) if (activeH(i)) {
    g.fillStyle = p.deck; g.fillRect(RIV[0] - 8, YS[i] - 25, RIV[1] - RIV[0] + 16, 50);
    g.fillStyle = p.road; g.fillRect(RIV[0] - 8, YS[i] - 21, RIV[1] - RIV[0] + 16, 42);
  }
  g.strokeStyle = p.mark; g.lineWidth = 1.6;
  for (let i = 0; i < 3; i++) if (activeH(i)) {
    const wide = hH(i) > 22;
    g.setLineDash(wide ? [] : [12, 12]);
    g.beginPath(); g.moveTo(-far, YS[i]); g.lineTo(W + far, YS[i]); g.stroke();
    if (wide) { g.setLineDash([12, 12]); for (const d of [-22, 22]) { g.beginPath(); g.moveTo(-far, YS[i] + d); g.lineTo(W + far, YS[i] + d); g.stroke(); } }
  }
  g.setLineDash([12, 12]);
  for (let j = 0; j < 3; j++) if (activeV(j)) { g.beginPath(); g.moveTo(XS[j], -far); g.lineTo(XS[j], H + far); g.stroke(); }
  g.setLineDash([]);

  // Rails du tram
  if (tramOn()) {
    g.strokeStyle = p.rail; g.lineWidth = 1;
    for (const d of [CW - 3.2, CW + 3.2, -CW - 3.2, -CW + 3.2]) { g.beginPath(); g.moveTo(-far, YS[1] + d); g.lineTo(W + far, YS[1] + d); g.stroke(); }
  }

  // Carrefours, passages piétons, îlots de giratoire
  for (const n of inters) {
    g.fillStyle = p.road; g.fillRect(n.x - n.hx - 14, n.y - n.hy - 14, (n.hx + 14) * 2, (n.hy + 14) * 2);
    g.fillStyle = p.zebra;
    for (let k = -n.hy + 4; k <= n.hy - 8; k += 8) { g.fillRect(n.x - n.hx - 10, n.y + k, 8, 4); g.fillRect(n.x + n.hx + 2, n.y + k, 8, 4); }
    for (let k = -n.hx + 4; k <= n.hx - 8; k += 8) { g.fillRect(n.x + k, n.y - n.hy - 10, 4, 8); g.fillRect(n.x + k, n.y + n.hy + 2, 4, 8); }
    if (n.round) {
      g.strokeStyle = p.mark; g.lineWidth = 1.4; g.setLineDash([5, 5]);
      g.beginPath(); g.arc(n.x, n.y, 21, 0, 7); g.stroke(); g.setLineDash([]);
      g.fillStyle = p.zebra; g.beginPath(); g.arc(n.x, n.y, 9.5, 0, 7); g.fill();
      g.fillStyle = p.park; g.beginPath(); g.arc(n.x, n.y, 7.5, 0, 7); g.fill();
      g.fillStyle = p.tree; g.beginPath(); g.arc(n.x, n.y, 3.6, 0, 7); g.fill();
    }
  }
}

const FONT = '-apple-system,system-ui,sans-serif';
function drawVehicle(c, L, p, night, time) {
  const K = KIND[c.kind], l = K.len, h = l / 2;
  let [x, y] = lanePos(L, c.s - h), ang = laneAngle(L);
  // contournement de l'îlot dans un giratoire
  for (const e of L.inters) if (e.n.round) {
    const u = (c.s - h - (e.c - e.hb)) / (2 * e.hb);
    if (u > 0 && u < 1) { const b = 5 * Math.sin(Math.PI * u); x += -Math.sin(ang) * b; y += Math.cos(ang) * b; }
  }
  if (c.anim) {
    const k = c.anim.t / .4, q = k * k * (3 - 2 * k);
    let da = ang - c.anim.a; while (da > Math.PI) da -= 2 * Math.PI; while (da < -Math.PI) da += 2 * Math.PI;
    x = c.anim.x + (x - c.anim.x) * q; y = c.anim.y + (y - c.anim.y) * q; ang = c.anim.a + da * q;
  }
  if (c.crashed) ang += 0.5;
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
  if (night && c.kind !== 'bike') {
    ctx.fillStyle = 'rgba(255,240,190,.11)';
    ctx.beginPath(); ctx.moveTo(h - 1, -4); ctx.lineTo(h + 22, -9); ctx.lineTo(h + 22, 9); ctx.lineTo(h - 1, 4); ctx.fill();
  }

  if (c.kind === 'amb') {

    ctx.beginPath(); ctx.arc(0, 0, 20, 0, 7); ctx.fill();
    ctx.fillStyle = '#fbfbf8'; rr(ctx, -h, -6, l, 12, 3); ctx.fill();
    ctx.fillStyle = '#e23b30'; ctx.fillRect(-3.5, -1.3, 7, 2.6); ctx.fillRect(-1.3, -3.5, 2.6, 7);

    ctx.fillStyle = '#8a6208'; rr(ctx, -8, -4, 12, 8, 1.5); ctx.fill();

    ctx.fillText('€', -2, 0.5);
  } else if (c.kind === 'bus') {
    ctx.fillStyle = c.color; rr(ctx, -h, -5.5, l, 11, 3); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.3)'; rr(ctx, -h + 3, -3.6, l - 11, 7.2, 1.5); ctx.fill();
    ctx.fillStyle = dark; rr(ctx, h - 6.5, -4.2, 3.5, 8.4, 1.2); ctx.fill();
  } else if (c.kind === 'truck') {
    ctx.fillStyle = '#d9d6cd'; rr(ctx, -h, -5.5, l - 12, 11, 1.5); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,.08)'; ctx.fillRect(-h + 3, -5.5, 1, 11); ctx.fillRect(-h + (l - 12) / 2, -5.5, 1, 11);
    ctx.fillStyle = c.color; rr(ctx, h - 10.5, -5, 10.5, 10, 2.5); ctx.fill();
    ctx.fillStyle = dark; rr(ctx, h - 5, -3.8, 3, 7.6, 1); ctx.fill();
  } else if (c.kind === 'bike') {
    ctx.fillStyle = night ? '#c9d2d8' : '#2a3036'; rr(ctx, -h, -0.9, l, 1.8, .9); ctx.fill();
    ctx.fillStyle = c.color; ctx.beginPath(); ctx.arc(0, 0, 2.5, 0, 7); ctx.fill();
  } else if (c.kind === 'tram') {
    ctx.fillStyle = '#f4f4ef'; rr(ctx, -h, -5.5, h - 1, 11, 3.5); ctx.fill(); rr(ctx, 1, -5.5, h - 1, 11, 3.5); ctx.fill();
    ctx.fillStyle = '#7d8790'; ctx.fillRect(-1.5, -3, 3, 6);

    ctx.fillStyle = '#e9b21f'; rr(ctx, h - 12, -5.5, 12, 11, 2.5); ctx.fill();

}

function pill(label, x, y, mode, hot, p) {

let hover = null, time = 0;

      ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = '700 13px ' + FONT; ctx.fillText('!', n.x, n.y + 2);
    } else if (n.broken) {

      ctx.beginPath(); ctx.arc(n.x, n.y, 12, 0, 7); ctx.fill();
      ctx.fillStyle = on ? '#3a2a00' : p.amber; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = '700 14px ' + FONT;

      if (n.hy === 22) {

    }

  }
}

    const [x, y] = lanePos(L, c.s - 12);

  }
  for (const n of inters) { if (inRect(n.pill, wx, wy)) return { type: 'pill', n }; if (inRect(n.pillR, wx, wy)) return { type: 'pillR', n }; }
  for (const n of inters)

  const w = ev.works;

  if (!resetBtn.classList.contains('sure')) {
    resetBtn.classList.add('sure'); resetBtn.textContent = 'Tout effacer ?';
    resetT = setTimeout(() => { resetBtn.classList.remove('sure'); resetBtn.textContent = 'Recommencer'; }, 3000);
    return;
  }
  clearTimeout(resetT);
  resetBtn.classList.remove('sure'); resetBtn.textContent = 'Recommencer';
  backup(); store.clear(OLD_KEY);
  applyState(fresh());
  toast('Nouvelle partie. L’ancienne reste récupérable dans Sauvegarde.', 6000);
});

/* ───────── Absence et sauvegarde ───────── */
const BACKUP = KEY + '-backup';
let saveOK = true, lastSave = 0, pending = null;
function save() { S.seen = Date.now(); saveOK = store.set(KEY, S); if (saveOK) lastSave = Date.now(); return saveOK; }
function saveNow() {
  if (save()) toast('Partie sauvegardée.');
  else toast('Ce navigateur refuse d’enregistrer la partie. Exporte un fichier pour ne rien perdre.', 7000);
  refreshSave();
}
const pack = () => ({ app: 'feu-vert', v: 2, at: Date.now(), data: S });
function backup() { S.seen = Date.now(); store.set(BACKUP, pack()); refreshSave(); }
function encode(o) {
  let bin = '';
  new TextEncoder().encode(JSON.stringify(o)).forEach(b => { bin += String.fromCharCode(b); });
  return 'FV2-' + btoa(bin);
}
function decode(text) {
  text = String(text || '').trim();
  let o;
  if (text[0] === '{') o = JSON.parse(text);
  else {
    const bin = atob(text.replace(/^FV2-/, '').replace(/\s+/g, ''));
    o = JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))));
  }
  if (!o || o.app !== 'feu-vert' || !o.data || typeof o.data !== 'object' || Array.isArray(o.data)) throw new Error('format');
  return o;
}
const fmtDate = t => new Date(t).toLocaleString('fr-FR', { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' });
function describe(o) {
  const d = normalize(o.data);
  return 'ville n° ' + (d.city + 1) + ' (' + MAP_NAME[MAPS[d.city % MAPS.length]] + '), ' + fmtMoney(d.money) + ' €, '
       + nf0.format(d.st.cars) + ' véhicules passés' + (isFinite(+o.at) && +o.at > 0 ? ', enregistrée le ' + fmtDate(+o.at) : '');
}
function applyState(next) {
  S = next; S.seen = Date.now();
  laneMap.clear(); inters = []; floats.length = 0; resetEv(); windowInc = 0;
  build(); bgDirty = true;
  if (!S.mission || !MISSIONS[S.mission.id]) newMission();
  save(); renderAch(); refreshNotif(); refreshUI(); refreshSave();
}
function ask(o, source) { // toujours demander avant d'écraser la partie en cours
  pending = o;
  $('sv-what').innerHTML = '<b>' + source + '</b> : ' + describe(o) + '.';
  $('sv-confirm').hidden = false; $('d-save').open = true;
  $('sv-confirm').scrollIntoView({ block: 'nearest' });
}
function tryImport(text, source) {
  try { ask(decode(text), source); }
  catch (e) { toast('Impossible de lire cette sauvegarde : ce n’est pas un fichier ou un code Feu Vert valide.', 7000); }
}
$('sv-yes').addEventListener('click', () => {
  if (!pending) return;
  const o = pending, fromBackup = o === pending && o._backup;
  pending = null; $('sv-confirm').hidden = true; $('sv-text').hidden = true; $('sv-text').value = ''; $('sv-load').textContent = 'Charger un code';
  const current = pack(); S.seen = Date.now();
  applyState(normalize(o.data));
  store.set(BACKUP, current); // l'ancienne partie devient la copie de secours : l'opération reste annulable
  refreshSave();
  toast(fromBackup ? 'Copie de secours restaurée.' : 'Partie chargée. L’ancienne reste récupérable dans Sauvegarde.', 6000);
});
$('sv-no').addEventListener('click', () => { pending = null; $('sv-confirm').hidden = true; });
$('sv-now').addEventListener('click', saveNow);
$('sv-exp').addEventListener('click', () => {
  save();
  const d = new Date(), z = n => String(n).padStart(2, '0');
  const name = 'feu-vert-' + d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate()) + '-' + z(d.getHours()) + 'h' + z(d.getMinutes()) + '.json';
  try {
    const url = URL.createObjectURL(new Blob([JSON.stringify(pack(), null, 1)], { type: 'application/json' }));
    const a = document.createElement('a');
    a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    toast('Fichier <b>' + name + '</b> envoyé dans tes téléchargements.', 6000);
  } catch (e) { toast('Le téléchargement a échoué. Utilise « Copier le code » à la place.', 7000); }
});
$('sv-imp').addEventListener('click', () => $('sv-file').click());
$('sv-file').addEventListener('change', e => {
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!file) return;
  if (file.size > 2e6) { toast('Ce fichier est trop gros pour être une sauvegarde Feu Vert.'); return; }
  const fr = new FileReader();
  fr.onload = () => tryImport(fr.result, 'Fichier ' + file.name.replace(/[<>&]/g, ''));
  fr.onerror = () => toast('Impossible de lire ce fichier.');
  fr.readAsText(file);
});
$('sv-copy').addEventListener('click', async () => {
  save();
  const code = encode(pack()), ta = $('sv-text');
  ta.hidden = false; ta.value = code; $('sv-load').textContent = 'Charger ce code';
  let ok = false;
  try { await navigator.clipboard.writeText(code); ok = true; }
  catch (e) { ta.focus(); ta.select(); try { ok = document.execCommand('copy'); } catch (e2) {} }
  toast(ok ? 'Code copié. Colle-le dans « Charger un code » sur l’autre version du jeu.' : 'Copie refusée par le navigateur : le code est affiché, copie-le à la main.', 7000);
});
$('sv-load').addEventListener('click', () => {
  const ta = $('sv-text');
  if (ta.hidden || !ta.value.trim()) { ta.hidden = false; ta.value = ''; ta.focus(); $('sv-load').textContent = 'Charger ce code'; return; }
  tryImport(ta.value, 'Code collé');
});
$('sv-back').addEventListener('click', () => {
  const b = store.get(BACKUP);
  if (!b || !b.data) { refreshSave(); return; }
  b._backup = true; ask(b, 'Copie de secours');
});
function refreshSave() {
  const b = store.get(BACKUP), btn = $('sv-back');
  btn.hidden = !(b && b.data);
  if (b && b.data) btn.textContent = 'Restaurer la copie du ' + fmtDate(b.at || Date.now());
  const ago = Math.max(0, Math.round((Date.now() - lastSave) / 1000));
  $('save-sum').textContent = !saveOK ? 'Sauvegarde : indisponible' : 'Sauvegarde : ' + (ago < 2 ? 'à l’instant' : 'il y a ' + ago + ' s');
  $('save-info').textContent = saveOK
    ? 'La partie s’enregistre seule toutes les 5 secondes dans ce navigateur. Exporte un fichier ou un code pour la mettre à l’abri ou la passer sur une autre version du jeu.'
    : 'Ce navigateur n’enregistre pas la partie. Exporte un fichier ou copie le code avant de fermer la fenêtre.';
}
function creditAway() {
  const away = Math.min((Date.now() - (S.seen || Date.now())) / 1000, 3 * 3600);
  S.seen = Date.now();
  if (away < 20 || S.rate <= 0) return;
  const gain = S.rate * away * 0.6;
  S.money += gain; S.total += gain; S.st.total += gain;
  const min = Math.round(away / 60);
  toast('Pendant ton absence (' + (min < 1 ? 'moins d’une minute' : min + ' min') + ') : <b>+' + fmt(gain) + ' €</b>', 7000);
}

/* ───────── Boucle ───────── */
let secT = 0, histT = 0;
function step(dt) {
  time += dt;
  const prev = S.clock;
  S.clock += dt * 24 / DAY;
  if (S.clock >= 24) {
    S.clock -= 24; S.day++;
    if (dayFull && S.st.accToday === 0) unlock('safe');
    dayFull = true; S.st.accToday = 0;
  }
  if (!isPeak(prev) && isPeak(S.clock)) toast('Heure de pointe : trafic dense, <b>revenus ×1,5</b>.');
  const tf = trafficF(S.clock);
  for (const n of inters) stepInter(n, dt);
  for (const L of lanes) stepLane(L, dt, tf);
  stepEvents(dt);
  if (S.mission && S.mission.id === 'flu') { if (S.F > .85) missionHit('flu', dt); else S.mission.prog = 0; }
  for (let i = floats.length - 1; i >= 0; i--) { floats[i].t += dt; if (floats[i].t > 1.6) floats.splice(i, 1); }
  secT += dt;
  if (secT >= 1) {
    S.rate += (windowInc / secT - S.rate) * 0.06; windowInc = 0; secT = 0;
    if (S.rate > S.st.bestRate) S.st.bestRate = S.rate;
    checkAch();
  }
  histT += dt;
  if (histT >= 10) { histT = 0; S.hist.push(Math.round(S.rate * 60 * 10) / 10); if (S.hist.length > 60) S.hist.shift(); }
}
let lastT = performance.now(), awayAcc = 0, awayT = 0, hiddenTimer = 0, uiClock = 0, saveClock = 0, backupClock = performance.now();
function tick(now, hidden) {
  const gap = Math.max(0, (now - lastT) / 1000); lastT = now;
  if (paused) return;
  S.st.play += Math.min(gap, 2);
  const sim = Math.min(gap, hidden ? 2 : 0.25), extra = gap - sim;
  if (extra > 1 && S.rate > 0) { const g = S.rate * extra * 0.6; S.money += g; S.total += g; S.st.total += g; awayAcc += g; awayT += extra; }
  let dt = sim * speed;
  while (dt > 1e-6) { const d = Math.min(dt, 1 / 30); step(d); dt -= d; }
}
function frame(now) {
  tick(now, false);
  draw();
  if (now - uiClock > 200) { uiClock = now; refreshUI(); }
  if (now - saveClock > 5000) { saveClock = now; save(); }
  if (now - backupClock > 600000) { backupClock = now; backup(); } // copie de secours toutes les 10 minutes
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', () => {
  clearInterval(hiddenTimer);
  if (document.hidden) {
    save();
    let n = 0;
    hiddenTimer = setInterval(() => { tick(performance.now(), true); refreshTitle(); if (++n % 10 === 0) save(); }, 1000);
  } else {
    tick(performance.now(), true);
    if (awayAcc > 0 && awayT > 20) {
      const min = Math.round(awayT / 60);
      toast('Pendant ton absence (' + (min < 1 ? 'moins d’une minute' : min + ' min') + ') : <b>+' + fmt(awayAcc) + ' €</b>', 7000);
    }
    awayAcc = 0; awayT = 0;
  }
});
window.addEventListener('pagehide', save);
window.addEventListener('resize', resize);
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', renderStats);

build(); resize(); creditAway();
if (!S.mission || !MISSIONS[S.mission.id]) newMission();
save(); renderAch(); refreshNotif(); refreshUI(); refreshSave();
if (!saveOK) toast('Ce navigateur n’enregistre pas la partie : pense à exporter un fichier depuis Sauvegarde.', 8000);
requestAnimationFrame(frame);

if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});

// Accès pour les tests
window.__feuVert = { get S() { return S; }, ev, KIND, room, oncoming, sig, get inters() { return inters; }, get lanes() { return lanes; }, step, build, refreshUI, act,
                     redraw() { bgDirty = true; }, view: () => ({ sc, ox, oy }) };
})();
</script>
</body>
