<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Traffic</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#d5dccb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1416" media="(prefers-color-scheme: dark)">
<style>
:root{
  --ground:#d5dccb; --glass:rgba(250,250,247,.78); --glass-line:rgba(255,255,255,.75);
  --ink:#1b2024; --muted:#687177; --hair:rgba(20,30,40,.1); --row:rgba(255,255,255,.55); --row-on:rgba(255,255,255,.96);
  --go:#1c9a5e; --go-ink:#fff; --go-soft:rgba(28,154,94,.14);
  --alert:#d8443a; --alert-soft:rgba(216,68,58,.13);
  --event:#c98a10; --event-soft:rgba(224,160,30,.18);
  --ach:#7a54d6; --ach-soft:rgba(122,84,214,.14);
  --info:#2f74d6; --info-soft:rgba(47,116,214,.13);
  --shadow:0 14px 40px rgba(30,40,50,.16), 0 2px 5px rgba(30,40,50,.08);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --ground:#0e1416; --glass:rgba(22,28,33,.76); --glass-line:rgba(255,255,255,.09);
    --ink:#e9edf0; --muted:#8d989f; --hair:rgba(255,255,255,.09); --row:rgba(255,255,255,.05); --row-on:rgba(255,255,255,.11);
    --go:#36c582; --go-ink:#05140c; --go-soft:rgba(54,197,130,.16);
    --alert:#f26b5e; --alert-soft:rgba(242,107,94,.16);
    --event:#f0b93a; --event-soft:rgba(240,185,58,.16);
    --ach:#a98bf5; --ach-soft:rgba(169,139,245,.17);
    --info:#6aa6f5; --info-soft:rgba(106,166,245,.16);
    --shadow:0 14px 40px rgba(0,0,0,.5), 0 2px 5px rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ground);color:var(--ink);overflow:hidden;
  font:13px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--info);outline-offset:2px}
svg.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.glass{background:var(--glass);border:1px solid var(--glass-line);box-shadow:var(--shadow);
  -webkit-backdrop-filter:blur(24px) saturate(1.6);backdrop-filter:blur(24px) saturate(1.6)}
.num{font-variant-numeric:tabular-nums}

/* ── Barre du haut : état de la ville à gauche, temps et menus à droite ── */
#top{position:fixed;top:10px;left:10px;right:10px;height:48px;border-radius:16px;display:flex;align-items:center;gap:6px;padding:0 8px 0 14px;white-space:nowrap}
#brand{display:flex;align-items:center;gap:8px;font-weight:700;margin-right:6px}
#brand i{width:10px;height:10px;border-radius:50%;background:var(--go);box-shadow:0 0 0 3px var(--go-soft)}
#brand span{font-weight:500;color:var(--muted)}
.stat{display:flex;align-items:center;gap:7px;padding:0 11px;height:32px;border-radius:10px}
.stat + .stat{border-left:1px solid var(--hair);border-radius:0}
.stat small{color:var(--muted);font-size:12px}
.stat b{font-weight:700}
#st-money{color:var(--go)} #st-money b{font-size:17px;color:var(--ink);letter-spacing:-.01em}
#st-rate{color:var(--info)} #st-flu{color:var(--event)} #st-bld{color:var(--ach)}
.stat b, .stat small{color:var(--ink)} .stat small{color:var(--muted)}
#st-bld.bad{color:var(--alert)} #st-bld.bad b{color:var(--alert)}
.mini{width:54px;height:5px;border-radius:3px;background:var(--hair);overflow:hidden}
.mini span{display:block;height:100%;background:var(--go);border-radius:3px;transition:width .4s,background .4s}
.sp{flex:1}
#clockbox{display:flex;align-items:center;gap:7px;padding:0 10px;color:var(--event)}
#clockbox.night{color:var(--info)}
#clock{font-weight:700;color:var(--ink)} #phase{color:var(--muted)}
.tb{flex:none;height:32px;min-width:32px;padding:0 9px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600;color:var(--muted)}
.tb:hover{background:var(--hair);color:var(--ink)}
.tb.on{background:var(--go);color:var(--go-ink)}
.tb.warn{background:var(--event-soft);color:var(--event)}
.sep{width:1px;height:22px;background:var(--hair);margin:0 4px}

/* ── Fil d'actualité : objectif et évènements en cours ── */
#strip{position:fixed;top:68px;left:10px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;pointer-events:none;max-width:330px}
.chip{display:flex;align-items:center;gap:9px;border-radius:13px;padding:7px 12px 7px 8px;position:relative;overflow:hidden;white-space:normal}
.chip .bd{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex:none;background:var(--c-soft);color:var(--c)}
.chip .bd svg.ic{width:16px;height:16px}
.chip b{font-weight:650;display:block}
.chip span{color:var(--muted);font-size:12px;display:block}
.chip .pg{position:absolute;left:0;bottom:0;height:3px;background:var(--c);opacity:.75;transition:width .3s}
.t-goal{--c:var(--info);--c-soft:var(--info-soft)} .t-gain{--c:var(--go);--c-soft:var(--go-soft)}
.t-alert{--c:var(--alert);--c-soft:var(--alert-soft)} .t-event{--c:var(--event);--c-soft:var(--event-soft)}
.t-ach{--c:var(--ach);--c-soft:var(--ach-soft)} .t-info{--c:var(--info);--c-soft:var(--info-soft)}
.t-build{--c:var(--muted);--c-soft:var(--hair)}
.chip.t-alert .bd{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.45}}

/* ── Améliorations, à droite ── */
#shop{position:fixed;top:68px;right:10px;width:236px;border-radius:16px;padding:10px 10px 6px}
#shop h2{margin:0 2px 8px;font-size:13px;font-weight:650;display:flex;align-items:center;gap:7px}
#shop h2 button{margin-left:auto}
#shop h2{cursor:pointer}
#shop.closed{width:auto;padding:6px 6px 6px 12px}
#shop.closed h2{margin:0}
#shop.closed #ups{display:none}
#shop.closed h2 button svg{transform:rotate(90deg)}
#shop:not(.closed) h2 button svg{transform:rotate(-90deg)}
.up{display:grid;grid-template-columns:28px 1fr auto;gap:0 9px;align-items:center;width:100%;text-align:left;
  background:var(--row);border:1px solid var(--hair);border-radius:12px;padding:7px 8px;margin-bottom:6px}
.up .bd{grid-row:1/3;width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--hair);color:var(--muted)}
.up .n{font-weight:600}
.up .d{grid-column:2;color:var(--muted);font-size:11.5px;line-height:1.25}
.up .c{grid-row:1/3;grid-column:3;font-weight:650;font-size:12px;padding:4px 8px;border-radius:999px;background:var(--hair);color:var(--muted)}
.up.ok{background:var(--row-on)} .up.ok .bd{background:var(--go-soft);color:var(--go)} .up.ok .c{background:var(--go);color:var(--go-ink)}
.up.ok:active{transform:scale(.985)} .up:not(.ok){cursor:default} .up.max .c{background:transparent}

/* ── Outils de construction, en bas ── */
#dock{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);border-radius:20px;padding:6px;display:flex;gap:4px;align-items:stretch}
.tool{width:74px;border-radius:14px;padding:7px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;color:var(--muted)}
.tool svg.ic{width:22px;height:22px}
.tool b{font-weight:600;font-size:12px;color:var(--ink)}
.tool small{font-size:11px;color:var(--muted)}
.tool kbd{position:absolute;top:4px;right:6px;font:600 10px -apple-system,sans-serif;color:var(--muted);opacity:.7}
.tool:hover{background:var(--hair)}
.tool.on{background:var(--ink);color:var(--ground)} .tool.on b{color:var(--ground)} .tool.on small,.tool.on kbd{color:var(--ground);opacity:.7}
.tool.on.erase{background:var(--alert);color:#fff} .tool.on.erase b,.tool.on.erase small,.tool.on.erase kbd{color:#fff}
#dock .sep{height:auto;margin:6px 3px}
#zoom{position:fixed;right:10px;bottom:12px;border-radius:14px;padding:4px;display:flex;flex-direction:column;gap:2px}
#hint{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);border-radius:999px;padding:6px 14px;color:var(--muted);font-size:12px;pointer-events:none;white-space:nowrap}
#hint:empty{display:none}

/* ── Notifications : une couleur et un pictogramme par nature ── */
#toasts{position:fixed;left:10px;bottom:12px;display:flex;flex-direction:column;gap:7px;pointer-events:none;width:300px}
.toast{display:flex;gap:10px;align-items:flex-start;border-radius:14px;padding:9px 12px 9px 9px;border-left:3px solid var(--c);animation:rise .28s both}
.toast .bd{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--c);color:#fff}
.toast .bd svg.ic{width:16px;height:16px}
.toast b{display:block;font-weight:650}
.toast span{display:block;color:var(--muted);font-size:12px}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
#paused{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);border-radius:18px;padding:14px 22px;font-weight:700;font-size:16px;display:none;pointer-events:none}
body.paused #paused{display:block}

/* ── Fenêtres : ville, succès, statistiques, sauvegarde ── */
#veil{position:fixed;inset:0;background:rgba(10,15,18,.32);display:grid;place-items:center;padding:20px}
#veil[hidden]{display:none}
#sheet{width:min(560px,100%);max-height:min(640px,100%);border-radius:22px;display:flex;flex-direction:column;overflow:hidden}
#sheet header{display:flex;align-items:center;gap:10px;padding:14px 14px 10px 18px}
#sheet header .bd{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--c-soft);color:var(--c)}
#sheet h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.01em}
#sheet header button{margin-left:auto}
#sheet .body{overflow-y:auto;padding:4px 18px 18px}
.sec[hidden]{display:none}
.note{color:var(--muted);font-size:12.5px;margin:0 0 10px;line-height:1.45}
.note b{color:var(--ink);font-weight:600}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.legend > div{display:flex;align-items:center;gap:9px;background:var(--row);border:1px solid var(--hair);border-radius:12px;padding:8px 10px}
.legend i{width:22px;height:22px;border-radius:7px;flex:none}
.legend b{display:block;font-weight:600} .legend span{display:block;color:var(--muted);font-size:12px}
.legend .off{opacity:.45}
.bar{height:6px;border-radius:3px;background:var(--hair);overflow:hidden;margin:6px 0 12px}
.bar span{display:block;height:100%;background:var(--ach);border-radius:3px}
.big{display:block;width:100%;padding:11px;border-radius:12px;background:var(--hair);color:var(--muted);font-weight:650;text-align:center}
.big.ok{background:var(--go);color:var(--go-ink)} .big.sure{background:var(--event);color:#2a1c00}
.achs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ach{display:flex;gap:9px;align-items:center;background:var(--row);border:1px solid var(--hair);border-radius:12px;padding:8px 10px;color:var(--muted)}
.ach .bd{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--hair);flex:none}
.ach b{display:block;font-weight:600} .ach span{display:block;font-size:12px}
.ach.on{background:var(--row-on)} .ach.on .bd{background:var(--ach);color:#fff} .ach.on b{color:var(--ink)}
#spark{display:block;width:100%;height:70px;margin:4px 0 8px}
.srow{display:flex;justify-content:space-between;padding:6px 2px;border-top:1px solid var(--hair);color:var(--muted)}
.srow b{color:var(--ink);font-weight:600}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.btns button{background:var(--row);border:1px solid var(--hair);border-radius:11px;padding:9px 8px;font-weight:600;text-align:center}
.btns button:hover{background:var(--row-on)}
.btns .wide{grid-column:1/3} .btns .go{background:var(--go);color:var(--go-ink);border-color:transparent}
.btns .danger{color:var(--alert)} .btns .danger.sure{background:var(--alert);color:#fff}
#sv-text{display:block;width:100%;margin-top:10px;border:1px solid var(--hair);border-radius:11px;background:var(--row-on);color:var(--ink);
  font:11px/1.4 ui-monospace,Menlo,monospace;padding:8px;resize:vertical;user-select:text;-webkit-user-select:text;word-break:break-all}
#sv-text[hidden],#sv-confirm[hidden]{display:none}
#sv-confirm{background:var(--info-soft);border-radius:12px;padding:10px 12px;margin-top:10px}
@media (prefers-reduced-motion: reduce){.toast,.chip.t-alert .bd{animation:none}}
@media (max-width:1560px){.tb .lb{display:none}}
@media (max-width:1240px){#toasts{bottom:104px;width:270px}}
@media (max-width:1180px){#phase,#st-rate small,#st-flu small{display:none}}
@media (max-width:980px){#st-rate,#brand span,.tool small{display:none}.tool{width:58px}}
@media (max-width:760px){#st-flu,#clockbox{display:none}#toasts{width:240px;bottom:100px}.tool{width:46px}.tool b{font-size:10px}}
</style>
</head>
<body>
<canvas id="cv" aria-label="Carte de la ville : trace des routes entre les maisons et les lieux, glisse pour te déplacer, molette pour zoomer"></canvas>

<header id="top" class="glass">
  <div id="brand"><i></i>Traffic<span id="cityname"></span></div>
  <div class="stat" id="st-money" title="Argent disponible"><svg class="ic"><use href="#i-coin"/></svg><b class="num" id="money">0 €</b></div>
  <div class="stat" id="st-rate" title="Revenu par minute"><svg class="ic"><use href="#i-trend"/></svg><b class="num" id="rate">0 €</b><small>par minute</small></div>
  <div class="stat" id="st-flu" title="Fluidité : des trajets rapides et directs multiplient les revenus"><svg class="ic"><use href="#i-gauge"/></svg><small>Fluidité</small><b class="num" id="fmul">×2,0</b><div class="mini"><span id="fbar"></span></div></div>
  <div class="stat" id="st-bld" title="Bâtiments reliés au réseau"><svg class="ic"><use href="#i-home"/></svg><b class="num" id="bld">0 sur 0</b><small id="bldl">reliés</small></div>
  <div class="sp"></div>
  <div id="clockbox"><svg class="ic"><use id="clock-ic" href="#i-sun"/></svg><span id="clock" class="num">09:00</span><span id="phase">Matinée</span></div>
  <button class="tb" id="b-pause" type="button" title="Pause (Espace)" aria-label="Pause"><svg class="ic"><use id="pause-ic" href="#i-pause"/></svg></button>
  <button class="tb num" id="b-speed" type="button" title="Vitesse (V)">×1</button>
  <div class="sep"></div>
  <button class="tb" data-open="city" type="button" title="Ville"><svg class="ic"><use href="#i-city"/></svg><span class="lb">Ville</span></button>
  <button class="tb" data-open="ach" type="button" title="Succès"><svg class="ic"><use href="#i-trophy"/></svg><span class="lb">Succès</span></button>
  <button class="tb" data-open="stat" type="button" title="Statistiques"><svg class="ic"><use href="#i-chart"/></svg><span class="lb">Stats</span></button>
  <button class="tb" data-open="save" type="button" title="Sauvegarde" id="b-save"><svg class="ic"><use href="#i-save"/></svg><span class="lb">Sauvegarde</span></button>
  <button class="tb" id="notif" type="button" title="Notifications"><svg class="ic"><use href="#i-bell"/></svg></button>
</header>

<div id="strip"></div>

<aside id="shop" class="glass">
  <h2><svg class="ic"><use href="#i-trend"/></svg><span>Améliorations</span><button class="tb" id="shop-t" type="button" title="Replier" aria-label="Replier les améliorations"><svg class="ic"><use href="#i-chev"/></svg></button></h2>
  <div id="ups"></div>
</aside>

<div id="zoom" class="glass"><button class="tb" id="z-in" type="button" title="Zoomer (+)" aria-label="Zoomer"><svg class="ic"><use href="#i-plus"/></svg></button><button class="tb" id="z-out" type="button" title="Dézoomer (−)" aria-label="Dézoomer"><svg class="ic"><use href="#i-minus"/></svg></button><button class="tb" id="z-fit" type="button" title="Recentrer (0)" aria-label="Recentrer la carte"><svg class="ic"><use href="#i-fit"/></svg></button></div>
<div id="hint" class="glass"></div>
<nav id="dock" class="glass" aria-label="Outils de construction"></nav>
<div id="toasts"></div>
<div id="paused" class="glass">En pause</div>

<div id="veil" hidden>
  <div id="sheet" class="glass" role="dialog" aria-modal="true" aria-labelledby="sh-title">
    <header id="sh-head"><div class="bd"><svg class="ic"><use id="sh-ic" href="#i-city"/></svg></div><h1 id="sh-title"></h1><button class="tb" id="sh-x" type="button" aria-label="Fermer"><svg class="ic"><use href="#i-x"/></svg></button></header>
    <div class="body">
      <section class="sec" id="m-city">
        <p class="note" id="city-note"></p>
        <div class="legend" id="legend"></div>
        <p class="note" id="city-goal"></p>
        <div class="bar"><span id="city-bar"></span></div>
        <button class="big" id="city-go" type="button">Fonder une nouvelle ville</button>
      </section>
      <section class="sec" id="m-ach"><p class="note" id="ach-note"></p><div class="achs" id="achs"></div></section>
      <section class="sec" id="m-stat">
        <canvas id="spark" width="1000" height="140" aria-label="Revenu par minute sur les dix dernières minutes"></canvas>
        <div id="stats"></div>
      </section>
      <section class="sec" id="m-save">
        <p class="note" id="save-info"></p>
        <div class="btns">
          <button id="sv-now" type="button" class="wide" title="Cmd + S">Sauvegarder maintenant</button>
          <button id="sv-exp" type="button">Exporter un fichier</button>
          <button id="sv-imp" type="button">Importer un fichier</button>
          <button id="sv-copy" type="button">Copier le code</button>
          <button id="sv-load" type="button">Charger un code</button>
          <button id="sv-back" type="button" class="wide" hidden></button>
          <button id="reset" type="button" class="wide danger">Recommencer une partie</button>
        </div>
        <textarea id="sv-text" rows="4" hidden spellcheck="false" aria-label="Code de sauvegarde" placeholder="Colle ici un code de sauvegarde"></textarea>
        <div id="sv-confirm" hidden>
          <div id="sv-what"></div>
          <div class="btns"><button id="sv-yes" type="button" class="go">Remplacer ma partie</button><button id="sv-no" type="button">Annuler</button></div>
        </div>
        <input type="file" id="sv-file" accept=".json,.txt,application/json,text/plain" hidden>
      </section>
    </div>
  </div>
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M14.8 9.2a3.6 3.6 0 1 0 0 5.6M7.8 11h5M7.8 13h5"/></symbol>
  <symbol id="i-trend" viewBox="0 0 24 24"><path d="M3.5 17l5.5-5.5 3.5 3.5L20.5 7M15 7h5.5v5.5"/></symbol>
  <symbol id="i-gauge" viewBox="0 0 24 24"><path d="M4.5 17a8 8 0 1 1 15 0"/><path d="M12 14l4-5.5"/><circle cx="12" cy="14.5" r="1.2"/></symbol>
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11.5L12 5l8 6.5"/><path d="M6.5 10v9h11v-9"/><path d="M10.5 19v-5h3v5"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.8"/><path d="M12 3v2.2M12 18.8V21M3 12h2.2M18.8 12H21M5.6 5.6l1.6 1.6M16.8 16.8l1.6 1.6M5.6 18.4l1.6-1.6M16.8 7.2l1.6-1.6"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M19.5 14.2A8 8 0 0 1 9.8 4.5a8 8 0 1 0 9.7 9.7z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8.5 5.5v13M15.5 5.5v13"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5l10.5 6.5L8 18.5z"/></symbol>
  <symbol id="i-trophy" viewBox="0 0 24 24"><path d="M8 4.5h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H5v1.5a3 3 0 0 0 3 3M16 6h3v1.5a3 3 0 0 1-3 3M12 13.5V17M8.5 19.5h7M10 17h4"/></symbol>

    pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    return;
  }

    const b = bonus(20, 20); earn(b); S.st.gold++; g.type = 'car'; ev.gold = null;
    floatText(g.rx, g.ry, '+' + fmt(b) + ' €', 'event'); missionHit('gold', 1); return;
  }
  if (e.button === 1 || e.shiftKey || (tool === 'main' && e.button === 0)) { panning = { x: e.clientX, y: e.clientY, moved: false, cell: i }; e.preventDefault(); return; }
  if (i < 0) return;

  if (mode === 'main') return;

    const [a, b] = [...ptrs.values()], d = Math.hypot(a.x - b.x, a.y - b.y) || 1, x = (a.x + b.x) / 2, y = (a.y + b.y) / 2;

$('sv-no').addEventListener('click', () => { pending = null; $('sv-confirm').hidden = true; });
$('sv-now').addEventListener('click', saveNow);
$('sv-exp').addEventListener('click', () => {
  save();
  const d = new Date(), z = n => String(n).padStart(2, '0');
  const name = 'traffic-' + d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate()) + '-' + z(d.getHours()) + 'h' + z(d.getMinutes()) + '.json';
  try {
    const url = URL.createObjectURL(new Blob([JSON.stringify(pack(), null, 1)], { type: 'application/json' }));
    const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    toast('gain', 'Fichier exporté', name + ' est dans tes téléchargements.', 6000, 'save');
  } catch (e) { toast('alert', 'Export impossible', 'Utilise « Copier le code » à la place.', 7000, 'save'); }
});
$('sv-imp').addEventListener('click', () => $('sv-file').click());
$('sv-file').addEventListener('change', e => {
  const file = e.target.files && e.target.files[0]; e.target.value = '';
  if (!file) return;
  if (file.size > 2e6) { toast('alert', 'Fichier trop gros', 'Ce n’est pas une sauvegarde Traffic.'); return; }
  const fr = new FileReader();
  fr.onload = () => tryImport(fr.result, 'Fichier ' + file.name);
  fr.onerror = () => toast('alert', 'Lecture impossible', 'Le fichier n’a pas pu être ouvert.');
  fr.readAsText(file);
});
$('sv-copy').addEventListener('click', async () => {
  save();
  const code = encode(pack()), ta = $('sv-text');
  ta.hidden = false; ta.value = code; $('sv-load').textContent = 'Charger ce code';
  let ok = false;
  try { await navigator.clipboard.writeText(code); ok = true; } catch (e) { ta.focus(); ta.select(); try { ok = document.execCommand('copy'); } catch (e2) {} }
  toast(ok ? 'gain' : 'info', ok ? 'Code copié' : 'Code affiché', ok ? 'Colle-le dans « Charger un code » sur l’autre version du jeu.' : 'La copie est refusée par le navigateur : copie-le à la main.', 6000, 'save');
});
$('sv-load').addEventListener('click', () => {
  const ta = $('sv-text');
  if (ta.hidden || !ta.value.trim()) { ta.hidden = false; ta.value = ''; ta.focus(); $('sv-load').textContent = 'Charger ce code'; return; }
  tryImport(ta.value, 'Code collé');
});
$('sv-back').addEventListener('click', () => { const b = store.get(BACKUP); if (!b || !b.data) { refreshSave(); return; } b._backup = true; ask(b, 'Copie de secours'); });
let resetT = 0;
$('reset').addEventListener('click', () => {
  const b = $('reset');
  if (!b.classList.contains('sure')) { b.classList.add('sure'); b.textContent = 'Confirmer : tout effacer'; resetT = setTimeout(() => { b.classList.remove('sure'); b.textContent = 'Recommencer une partie'; }, 3500); return; }
  clearTimeout(resetT); b.classList.remove('sure'); b.textContent = 'Recommencer une partie';
  backup(); applyState(fresh()); refreshSave();
  toast('info', 'Nouvelle partie', 'L’ancienne reste récupérable dans la copie de secours.', 6000);
});
function refreshSave() {
  const b = store.get(BACKUP), btn = $('sv-back');
  btn.hidden = !(b && b.data && b.v === 3);
  if (!btn.hidden) btn.textContent = 'Restaurer la copie de secours du ' + fmtDate(b.at || Date.now());
  const ago = Math.max(0, Math.round((Date.now() - lastSave) / 1000));
  $('save-info').innerHTML = saveOK
    ? 'La partie s’enregistre seule toutes les 5 secondes dans ce navigateur (dernière fois <b>' + (ago < 2 ? 'à l’instant' : 'il y a ' + ago + ' s') + '</b>). Exporte un fichier ou un code pour la mettre à l’abri ou la passer sur une autre version du jeu.'
    : '<b>Ce navigateur n’enregistre pas la partie.</b> Exporte un fichier ou copie le code avant de fermer la fenêtre.';
}

/* ───────── Absence ───────── */
function creditAway() {
  const away = Math.min((Date.now() - (S.seen || Date.now())) / 1000, 3 * 3600);
  S.seen = Date.now();
  if (away < 20 || S.rate <= 0) return;
  const gain = S.rate * away * 0.6;
  S.money += gain; S.total += gain; S.st.total += gain;
  const min = Math.round(away / 60);
  toast('gain', 'Pendant ton absence', '+' + fmt(gain) + ' € en ' + (min < 1 ? 'moins d’une minute' : min + ' min'), 7000);
}

/* ───────── Boucle ───────── */
let secT = 0, histT = 0;
function step(dt) {
  time += dt;
  const prev = S.clock;
  S.clock += dt * 24 / DAY;
  if (S.clock >= 24) { S.clock -= 24; S.day++; }
  if (!isPeak(prev) && isPeak(S.clock)) toast('event', 'Heure de pointe', 'Plus de départs, revenus ×1,5.', 4500, 'clock');
  if (netDirty) rebuildNet();
  stepTrips(dt, trafficF(S.clock));
  stepCars(dt);
  stepGrowth(dt);
  stepEvents(dt);
  if (S.mission && S.mission.id === 'flu') { if (S.F > .7) missionHit('flu', dt); else S.mission.prog = 0; }
  for (let i = floats.length - 1; i >= 0; i--) { floats[i].t += dt; if (floats[i].t > 1.4) floats.splice(i, 1); }
  secT += dt;
  if (secT >= 1) {
    S.rate += (windowInc / secT - S.rate) * 0.06; windowInc = 0; secT = 0;
    if (S.rate > S.st.bestRate) S.st.bestRate = S.rate;
    checkAch();
    // Filet de sécurité : sans aucune maison reliée ni de quoi construire, la mairie avance de quoi tracer un chemin.
    if (S.money < 40 && !B.some(b => b.h && b.conn)) { S.money = 40; toast('info', 'Coup de pouce de la mairie', 'Ta caisse est remontée à 40 € pour relier une première maison.', 6000, 'coin'); }
  }
  histT += dt;
  if (histT >= 10) { histT = 0; S.hist.push(Math.round(S.rate * 600) / 10); if (S.hist.length > 60) S.hist.shift(); }
}
let lastT = performance.now(), awayAcc = 0, awayT = 0, hiddenTimer = 0, uiClock = 0, saveClock = 0, backupClock = performance.now(), lastFrame = performance.now();
function tick(now, hidden) {
  const gap = Math.max(0, (now - lastT) / 1000); lastT = now;
  if (paused) return;
  S.st.play += Math.min(gap, 2);
  const sim = Math.min(gap, hidden ? 2 : 0.25), extra = gap - sim;
  if (extra > 1 && S.rate > 0) { const g = S.rate * extra * 0.6; S.money += g; S.total += g; S.st.total += g; awayAcc += g; awayT += extra; }
  let dt = sim * speed;
  while (dt > 1e-6) { const d = Math.min(dt, 1 / 30); step(d); dt -= d; }
}
function frame(now) {
  tick(now, false);
  draw(Math.min(.1, (now - lastFrame) / 1000) * (paused ? 0 : speed)); lastFrame = now;
  if (now - uiClock > 200) { uiClock = now; refreshUI(); }
  if (now - saveClock > 5000) { saveClock = now; if (!dragging) save(); }
  if (now - backupClock > 600000) { backupClock = now; backup(); }
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', () => {
  clearInterval(hiddenTimer);
  if (document.hidden) { save(); let n = 0; hiddenTimer = setInterval(() => { tick(performance.now(), true); if (++n % 10 === 0) save(); }, 1000); }
  else {
    tick(performance.now(), true);
    if (awayAcc > 0 && awayT > 20) { const min = Math.round(awayT / 60); toast('gain', 'Pendant ton absence', '+' + fmt(awayAcc) + ' € en ' + (min < 1 ? 'moins d’une minute' : min + ' min'), 7000); }
    awayAcc = 0; awayT = 0;
  }
});
window.addEventListener('pagehide', save);
window.addEventListener('resize', resize);

loadGrid(); rebuildNet(); resize(); creditAway();
if (!S.mission || !MISSIONS[S.mission.id]) newMission();
setShop(S.shop);
setTool('main'); save(); refreshUI();
if (!saveOK) toast('alert', 'Partie non enregistrée', 'Ce navigateur ne garde rien : pense à exporter un fichier.', 8000, 'save');
if (S.st.tiles === 0) toast('info', 'Bienvenue', 'Prends l’outil Chemin en bas et trace un trait des maisons jusqu’au marché.', 9000, 'path');
requestAnimationFrame(frame);
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});

// Accès pour les tests
window.__feuVert = { get S() { return S; }, get B() { return B; }, R, T, J, D, deg, jn, ev, E, live, ND, COLS, ROWS, C, step, paint, erase, setJunction, line, grow, rebuildNet,
  get nCars() { return nCars; }, get nConn() { return nConn; }, get nUn() { return nUn; }, applyState, fresh, normalize, chooseNext, redraw() { bgDirty = true; }, view: () => ({ sc, ox, oy }), cam, zoomAt, panBy, resetCam, heat, refreshUI, setTool };
})();
</script>
